name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - run: python -m pip install -r requirements-validation.txt
      - run: python -m pytest -q
      - run: python -m examples.review_demo
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests examples
      - run: python -m mypy src --ignore-missing-imports
