version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: ona-api:latest
    container_name: ona-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - ona-network
    volumes:
      - ona-reports:/app/data/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    image: ona-dashboard:latest
    container_name: ona-dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    networks:
      - ona-network
    volumes:
      - ona-reports:/app/data/reports
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

networks:
  ona-network:
    driver: bridge

volumes:
  ona-reports:
    driver: local
